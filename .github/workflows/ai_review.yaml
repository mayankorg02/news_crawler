name: AI Review

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture pull request snapshot
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          pr_path="${RUNNER_TEMP}/pr.json"
          files_path="${RUNNER_TEMP}/pr-files.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${pr_path}"
          base_sha="$(jq -er '.base.sha' "${pr_path}")"
          head_sha="$(jq -er '.head.sha' "${pr_path}")"
          if [[ ! "${base_sha}" =~ ^[[:xdigit:]]{40}$ || ! "${head_sha}" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "::error::GitHub returned an invalid pull request revision."
            exit 1
          fi

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            > "${files_path}"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            > "${RUNNER_TEMP}/pr-latest.json"
          latest_base="$(jq -er '.base.sha' "${RUNNER_TEMP}/pr-latest.json")"
          latest_head="$(jq -er '.head.sha' "${RUNNER_TEMP}/pr-latest.json")"
          if [[ "${base_sha}" != "${latest_base}" || "${head_sha}" != "${latest_head}" ]]; then
            echo "::error::The pull request changed while its review input was being collected; rerun the workflow."
            exit 1
          fi
          if [[ "$(jq 'flatten | length' "${files_path}")" -eq 0 ]]; then
            echo "::error::GitHub returned no changed files for this pull request."
            exit 1
          fi

          printf 'base_sha=%s\nhead_sha=%s\n' "${base_sha}" "${head_sha}" >> "${GITHUB_OUTPUT}"

      - name: Check out PR base for implementation context
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare review context
        run: |
          set -euo pipefail
          python3 .github/scripts/ai_review.py prepare \
            --repo . \
            --pr-files "${RUNNER_TEMP}/pr-files.json" \
            --prompt "${RUNNER_TEMP}/review-prompt.txt" \
            --changed-lines "${RUNNER_TEMP}/changed-lines.json"

      - name: Run local Ollama review
        env:
          OLLAMA_MODEL: gpt-oss:20b
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location https://ollama.com/install.sh | sh
          ollama serve > "${RUNNER_TEMP}/ollama.log" 2>&1 &

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "${ready}" != "1" ]]; then
            cat "${RUNNER_TEMP}/ollama.log"
            echo "::error::Ollama did not start."
            exit 1
          fi

          ollama pull "${OLLAMA_MODEL}"
          python3 .github/scripts/ai_review.py infer \
            --model "${OLLAMA_MODEL}" \
            --prompt "${RUNNER_TEMP}/review-prompt.txt" \
            --output "${RUNNER_TEMP}/ai-review.json"
          if [[ ! -s "${RUNNER_TEMP}/ai-review.json" ]]; then
            echo "::error::Ollama returned an empty review."
            exit 1
          fi

      - name: Validate review findings
        run: |
          set -euo pipefail
          python3 .github/scripts/ai_review.py validate \
            --model-output "${RUNNER_TEMP}/ai-review.json" \
            --changed-lines "${RUNNER_TEMP}/changed-lines.json" \
            --comments "${RUNNER_TEMP}/review-comments.json"

      - name: Verify PR head before posting
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          latest_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [[ "${latest_head}" != "${PR_HEAD_SHA}" ]]; then
            echo "::error::The pull request changed during review; rerun the workflow."
            exit 1
          fi

      - name: Post inline review comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BOT_LOGIN: github-actions[bot]
        run: |
          set -euo pipefail
          python3 .github/scripts/ai_review.py publish \
            --comments "${RUNNER_TEMP}/review-comments.json"
